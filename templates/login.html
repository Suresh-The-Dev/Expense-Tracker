{% extends "auth_base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Sign in - Expense Tracker{% endblock %}
{% block auth_content %}
<h1>Sign in</h1>
<p class="muted">Pick up where you left off.</p>
<form method="post" action="{{ url_for('login', next=request.args.get('next')) }}" class="stack" novalidate>
  {{ csrf() }}
  <div class="field">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" value="{{ form.email }}" maxlength="100" autocomplete="email" inputmode="email" autocapitalize="none" required>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required>
  </div>
  <button class="btn btn-primary btn-block" type="submit">Sign in</button>
</form>
<p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
{% endblock %}
