{% from "_macros.html" import icon %}
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="flash-stack" role="status" aria-live="polite">
  {% for category, message in messages %}
  <div class="alert alert-{{ category if category in ('success', 'error', 'info') else 'info' }}">
    <span>{{ message }}</span>
    <button type="button" class="alert-close" aria-label="Dismiss message">{{ icon('close', 18) }}</button>
  </div>
  {% endfor %}
</div>
{% endif %}
{% endwith %}
